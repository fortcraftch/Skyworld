  name: "Espada de Novato"
  category: "WEAPON"
  rarity: "COMUN"
  custom_stats:
    GENERIC_ATTACK_DAMAGE: 4.0        # Vanilla: Daño de ataque base
    GENERIC_ATTACK_SPEED: -2.4        # Vanilla: Velocidad de ataque
