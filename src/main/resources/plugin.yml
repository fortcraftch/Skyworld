name: Skyworld
version: '1.3-SNAPSHOT'
main: Fortcraft.skyworld.Skyworld
api-version: '1.21'
load: POSTWORLD
commands:
  pathtool:
    description: Entrega la herramienta de administración para la creación de redes de grafos.
    permission: skyworld.admin.paths
    usage: /<command>

  questadmin:
    description: "Comando de administración del sistema de misiones."
    permission: skyworld.admin.quests
    usage: "/questadmin <iniciar|completar|reset> <id_mision> [jugador]"
